<?xml version="1.0" encoding="utf-8"?>
<!-- Offline GGUF Chat - App Icon Foreground -->
<!-- Chat bubble + brain/local AI motif, works on dark and light backgrounds -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#03DAC6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00897B;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="40" y="40" width="432" height="432" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Brain / AI local nodes -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Left node -->
    <circle cx="178" cy="218" r="26" />
    <!-- Center node -->
    <circle cx="256" cy="178" r="26" />
    <!-- Right node -->
    <circle cx="334" cy="218" r="26" />
    <!-- Bottom node -->
    <circle cx="256" cy="294" r="26" />

    <!-- Connections (neural network style) -->
    <path d="M178 218 L256 178" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7" />
    <path d="M256 178 L334 218" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7" />
    <path d="M178 218 L256 294" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7" />
    <path d="M334 218 L256 294" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7" />
    <path d="M256 178 L256 294" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.5" />

    <!-- Chat bubble tail -->
    <path d="M150 380 Q150 380 210 380 L250 380 L250 460 L170 460 Q150 460 150 440 Z" fill="#FFFFFF" />
  </g>

  <!-- Subtle offline/shield badge (top right) -->
  <path d="M420 80 L470 80 L470 130 L420 130 Z" fill="#FFFFFF" opacity="0.25" />
  <path d="M428 88 L462 88 L462 122 L428 122 Z" fill="#03DAC6" opacity="0.9" />
</svg>
