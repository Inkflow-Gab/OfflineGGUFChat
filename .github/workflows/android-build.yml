name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI builds one ABI (arm64-v8a): the native bridge is identical per ABI, and
# three of them triples the CMake time for no extra signal. Heap, parallelism and
# caching come from gradle.properties so local and CI behave the same.

jobs:
  # ---------------------------------------------------------------- native
  # No NDK, no Gradle, no llama.cpp: plain g++ on the host. This is the job that
  # catches a regression in the GGUF parser or the JNI contract in ~30 seconds.
  native:
    name: Native checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run host C++ checks
        shell: bash
        run: ./scripts/check-native.sh 2>&1 | tee build.log

      # Runner logs are awkward to reach from a sandbox or a phone, so a failing
      # build also leaves its compiler/test errors on the pull request itself.
      - name: Post the failure digest to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: "./scripts/ci-digest.sh build.log '`check-native.sh` failed'"

  # ----------------------------------------------------------------- tests
  unit-tests:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Runner logs are awkward to reach from a sandbox or a phone, so a failing
      # build also leaves its compiler/test errors on the pull request itself.
      - name: Post the failure digest to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: "./scripts/ci-digest.sh build.log '`testDebugUnitTest` failed'"

  # ------------------------------------------------------------------ apks
  apk:
    name: Debug + release APKs
    runs-on: ubuntu-latest
    needs: [ native, unit-tests ]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace -Pofflinegguf.abis=arm64-v8a 2>&1 | tee build.log

      - name: Build release APK
        # Without keystore secrets the release APK is signed with the debug key,
        # so it still installs. Add the four secrets below to publish a signed one.
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: ./gradlew assembleRelease --stacktrace -Pofflinegguf.abis=arm64-v8a 2>&1 | tee -a build.log

      - name: Collect and rename APKs
        shell: bash
        run: |
          VERSION="$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/OfflineGGUFChat-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/OfflineGGUFChat-${VERSION}-release.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Runner logs are awkward to reach from a sandbox or a phone, so a failing
      # build also leaves its compiler/test errors on the pull request itself.
      - name: Post the failure digest to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: "./scripts/ci-digest.sh build.log 'APK build failed'"

  # -------------------------------------------------------------- release
  # Pushes a v* tag and the same APKs become a GitHub Release.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ apk ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: apks
          path: dist

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Offline GGUF Chat — local-only inference for Android.

            **Which APK?**
            - `debug` — installable anywhere, keeps logs, no minification.
            - `release` — the one to use day to day. Signed with the repository
              keystore when the secrets are configured, otherwise with the debug
              key so the artifact still installs.

            Both APKs are built **without** llama.cpp compiled in: header parsing,
            the model adviser and the whole UI work, and generation reports exactly
            what to do to enable the engine. See `docs/NATIVE.md` and
            `scripts/sync-llama.sh` for the opt-in build.
