name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI builds one ABI (arm64-v8a): the native bridge is identical per ABI, and
# three of them triples the CMake time for no extra signal. Heap, parallelism and
# caching come from gradle.properties so local and CI behave the same.

jobs:
  # ---------------------------------------------------------------- native
  # No NDK, no Gradle, no llama.cpp: plain g++ on the host. This is the job that
  # catches a regression in the GGUF parser or the JNI contract in ~30 seconds.
  native:
    name: Native checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run host C++ checks
        shell: bash
        run: ./scripts/check-native.sh 2>&1 | tee build.log

      # Runner logs are awkward to reach from a sandbox or a phone, so a failing
      # build also leaves its compiler/test errors on the pull request itself.
      - name: Post the failure digest to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: "./scripts/ci-digest.sh build.log '`check-native.sh` failed'"

  # ----------------------------------------------------------------- tests
  unit-tests:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Runner logs are awkward to reach from a sandbox or a phone, so a failing
      # build also leaves its compiler/test errors on the pull request itself.
      - name: Post the failure digest to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: "./scripts/ci-digest.sh build.log '`testDebugUnitTest` failed'"

  # ------------------------------------------------------------------ apks
  apk:
    name: Debug + release APKs
    runs-on: ubuntu-latest
    needs: [ native, unit-tests ]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Fetch the pinned llama.cpp source
        shell: bash
        run: ./scripts/sync-llama.sh 2>&1 | tee build.log

      - name: Build debug APK with llama.cpp
        shell: bash
        run: ./gradlew assembleDebug --stacktrace -Pofflinegguf.llama=true -Pofflinegguf.abis=arm64-v8a 2>&1 | tee -a build.log

      # THE one release keystore, created once by scripts/setup-keystore.sh and
      # stored base64-encoded as the KEYSTORE_B64 secret. Every release signed
      # with it installs as an update over the previous one — chats, models and
      # settings survive. Never rotate it; see docs/SIGNING.md.
      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded — release APK will be update-signed."
          else
            echo "No KEYSTORE_B64 secret — release APK falls back to the debug key."
            echo "Run scripts/setup-keystore.sh once to fix updates forever."
          fi

      - name: Build release APK
        # Signed with the decoded keystore above when the secrets exist;
        # otherwise signed with the debug key so the artifact still installs.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: ./gradlew assembleRelease --stacktrace -Pofflinegguf.llama=true -Pofflinegguf.abis=arm64-v8a 2>&1 | tee -a build.log

      - name: Verify both APKs package the real engine
        shell: bash
        run: |
          for variant in debug release; do
            APK="$(find "app/build/outputs/apk/$variant" -maxdepth 1 -name '*.apk' -print -quit)"
            test -n "$APK"
            unzip -p "$APK" lib/arm64-v8a/libllama_jni.so > "/tmp/libllama_jni-$variant.so"
            strings "/tmp/libllama_jni-$variant.so" > "/tmp/libllama_jni-$variant.strings"
            grep -q 'llama.cpp' "/tmp/libllama_jni-$variant.strings"
            grep -q 'Java_com_offlinegguf_chat_inference_LlamaNative_nativeEngineAvailable' \
              "/tmp/libllama_jni-$variant.strings"
            echo "$variant: verified real llama.cpp JNI library in $APK"
          done

      - name: Collect and rename APKs
        shell: bash
        run: |
          VERSION="$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/OfflineGGUFChat-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/OfflineGGUFChat-${VERSION}-release.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh dist

      # Prove, in every build log, exactly which certificate signed the release
      # APK. Same SHA-256 across versions = updates install in place.
      - name: Show the release signing certificate
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "dist/OfflineGGUFChat-${VERSION}-release.apk" \
            | grep -E 'Signer #1 certificate (DN|SHA-256)' || true

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Runner logs are awkward to reach from a sandbox or a phone, so a failing
      # build also leaves its compiler/test errors on the pull request itself.
      - name: Post the failure digest to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: "./scripts/ci-digest.sh build.log 'APK build failed'"

  # -------------------------------------------------------------- release
  # Pushes a v* tag and the same APKs become a GitHub Release.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ apk ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: apks
          path: dist

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Offline GGUF Chat — on-device GGUF inference for Android, with an
            optional bring-your-own-key cloud mode (OpenRouter / Groq / NVIDIA).

            **Which APK?**
            - `release` — the one to use day to day.
            - `debug` — installable anywhere, keeps logs, no minification.

            **Updating:** every release APK is signed with the same keystore, so
            a new version installs straight over the old one — chats, models and
            settings are kept. (Exception: if you are coming from an old
            debug-signed build, uninstall once, then updates work forever.)

            Both APKs include the pinned llama.cpp CPU backend and are ready to
            load a compatible local GGUF model. No model weights are bundled;
            import one from Models → Import. No root access is needed. See
            `docs/NATIVE.md` for local builds and `docs/SIGNING.md` for signing.
