# --- JVM ---
# Room + Compose + kapt together need more than the default heap. 2 GB is the
# floor for a comfortable build; CI runners use the same value.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# --- Gradle ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configureondemand=false

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.enableResourceOptimizations=false
android.suppressUnsupportedCompileSdk=34

# Bumped by CI on release tags via -PAPP_VERSION_CODE / -PAPP_VERSION_NAME.
APP_VERSION_CODE=5
APP_VERSION_NAME=1.4.0
